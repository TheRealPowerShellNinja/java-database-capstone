name: Frontend Lint CI

on:
  push:
  pull_request:

jobs:
  lint-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd app/src/main/resources/static
          npm init -y
          npm install eslint

      - name: Run ESLint
        run: |
          cd app/src/main/resources/static
          npx eslint . || true